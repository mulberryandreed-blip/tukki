<!-- @dsCard group="Website" viewport="1280x900" name="Journal" subtitle="Guide list with search + filters, article view" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Useful things we've learned — Mulberry &amp; Reed</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script>window.DS=window.MulberryReedDesignSystem_309c80;</script>
<script src="content.js"></script><script type="text/babel" src="Chrome.jsx"></script>
<script type="module">import * as m from './blog-data.js';window.MR_BLOG=m.articles;window.dispatchEvent(new Event('mr-blog'));import('./resources-data.js').then(r=>{window.MR_RES=r.resources;window.dispatchEvent(new Event('mr-res'));});</script>
</head><body><div id="root"></div>
<script type="text/babel">
const CATS=["All","Brand","Marketing","Social","Content","Websites","Growth","Money","Customers","Business","Tools"];
const NEEDS=["All","Get noticed","Get more customers","Make more money","Save money","Save time","Keep customers","Build your brand","Learn the basics"];
const lab={fontFamily:'var(--font-display)',fontWeight:500,fontSize:13,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--ink-5)',margin:'0 0 12px'};
const body={fontSize:17,lineHeight:1.65,color:'var(--ink-article)',margin:0};
function Article({a,all,open,back}){const {ArticleCallout,StepList}=window.DS;const c=a.content;
 return <div style={{maxWidth:680,margin:'0 auto',padding:'clamp(28px,6vw,56px) 22px 96px'}}>
  <button onClick={back} style={{fontFamily:'inherit',fontSize:15,fontWeight:600,color:'var(--berry-deep)',background:'none',border:'none',cursor:'pointer',padding:0,margin:'0 0 clamp(28px,5vw,44px)'}}>← All guides</button>
  <article style={{display:'flex',flexDirection:'column',gap:36}}>
   <div><p style={{fontSize:13,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--berry-deep)',margin:'0 0 14px'}}>{a.category}</p>
    <h1 style={{fontFamily:'var(--font-display)',fontWeight:400,fontSize:'clamp(30px,6vw,46px)',lineHeight:1.06,letterSpacing:'-0.005em',margin:'0 0 18px'}}>{a.title}</h1>
    <p style={{fontSize:'clamp(18px,2.6vw,21px)',lineHeight:1.5,color:'var(--ink-2)',margin:'0 0 14px'}}>{a.summary}</p>
    <p style={{fontSize:14,fontWeight:600,color:'var(--ink-5)',margin:0}}>{a.readingTime}</p></div>
   {a.photo&&<img src={'../../assets/journal/'+a.photo.split('/').pop()} alt={a.title} style={{width:'100%',display:'block',borderRadius:14}}/>}
   <ArticleCallout>{c.short}</ArticleCallout>
   {c.learned&&<section><h2 style={lab}>What I've learned</h2><p style={body}>{c.learned}</p></section>}
   {c.steps&&<section><h2 style={lab}>What to do</h2><StepList steps={c.steps}/></section>}
   {c.example&&<ArticleCallout variant="example" note={c.example.note}>{c.example.lines.map((l,i)=><div key={i}>{l}</div>)}</ArticleCallout>}
   {c.why&&<section><h2 style={lab}>Why it works</h2><p style={body}>{c.why}</p></section>}
   <ArticleCallout variant="remember">{c.remember}</ArticleCallout>
   <p style={{fontFamily:'var(--font-display)',fontWeight:500,fontSize:'clamp(17px,3vw,20px)',color:'var(--berry-deep)',margin:0}}>Tell a good story. Make it stick. Leave a mark.</p>
   {c.related&&<div style={{borderTop:'1px solid rgba(35,27,25,.1)',paddingTop:28}}><p style={{fontSize:13,fontWeight:600,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--ink-5)',margin:'0 0 12px'}}>More useful reads</p>
    {c.related.map(s=>all.find(x=>x.slug===s)).filter(Boolean).map(r=><a key={r.slug} href="#" onClick={e=>{e.preventDefault();open(r.slug)}} style={{display:'block',padding:'12px 0',fontSize:18,fontWeight:600,color:'var(--berry-deep)',borderBottom:'1px solid rgba(35,27,25,.08)'}}>{r.title} →</a>)}</div>}
  </article></div>;}
function App(){const {UnderlineTabs,SearchField,FilterPill,ArticleRow,ResourceCard,SiteFooter}=window.DS;
 const [all,setAll]=React.useState(window.MR_BLOG||[]);
 const [slug,setSlug]=React.useState(((location.hash||'').match(/post=([\w-]+)/)||[])[1]||null);
 const [tab,setTab]=React.useState((location.hash||'').includes('resources')?'tools':'guides');const [res,setRes]=React.useState(window.MR_RES||[]);const [rcat,setRcat]=React.useState('All');
 React.useEffect(()=>{const f=()=>setRes(window.MR_RES);window.addEventListener('mr-res',f);if(window.MR_RES)f();return()=>window.removeEventListener('mr-res',f)},[]);const [q,setQ]=React.useState('');const [cat,setCat]=React.useState('All');const [need,setNeed]=React.useState('All');
 React.useEffect(()=>{const f=()=>setAll(window.MR_BLOG);window.addEventListener('mr-blog',f);if(window.MR_BLOG)f();return()=>window.removeEventListener('mr-blog',f)},[]);
 const open=s=>{setSlug(s);history.replaceState(null,'','#post='+s);window.scrollTo(0,0)};const back=()=>{setSlug(null);history.replaceState(null,'',location.pathname);window.scrollTo(0,0)};
 const cur=slug&&all.find(a=>a.slug===slug);
 const ql=q.trim().toLowerCase();
 const vis=all.filter(a=>(cat==='All'||a.category===cat)&&(need==='All'||a.need===need)&&(!ql||(a.title+' '+a.summary+' '+a.category+' '+a.need+' '+(a.keywords||[]).join(' ')).toLowerCase().includes(ql)));
 return <div style={{minHeight:'100vh',position:'relative',overflowX:'clip'}}>
  <img src="../../assets/illustrations/ink-wash.png" alt="" aria-hidden="true" style={{position:'absolute',left:0,bottom:'4%',width:'100%',zIndex:0,pointerEvents:'none',transform:'rotate(180deg)'}}/>
  <Nav active="journal"/>
  <div style={{position:'relative',zIndex:1}}>
  {cur?<Article a={cur} all={all} open={open} back={back}/>:
  <div style={{maxWidth:760,margin:'0 auto',padding:'clamp(40px,8vw,88px) 22px 96px'}}>
   <header style={{margin:'0 0 clamp(32px,6vw,52px)'}}>
    <p style={{fontSize:13,fontWeight:600,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--berry-deep)',margin:'0 0 18px'}}>Mulberry & Reed · Journal</p>
    <h1 style={{fontFamily:'var(--font-display)',fontWeight:400,fontSize:'clamp(34px,7vw,56px)',lineHeight:1.03,letterSpacing:'-0.005em',margin:'0 0 24px'}}>Useful things we've learned.</h1>
    <div style={{fontSize:'clamp(17px,2.2vw,20px)',lineHeight:1.5,color:'var(--ink-2)',maxWidth:'34em'}}><p style={{margin:'0 0 14px'}}>50 short guides. 14 years of lessons. Free to use.</p><p style={{margin:0}}>No long reports. No big words. No email needed. Just useful advice you can use.</p></div>
   </header>
   <div style={{margin:'0 0 26px'}}><UnderlineTabs items={[{value:'guides',label:'Guides'},{value:'tools',label:'Free tools'}]} value={tab} onChange={setTab}/></div>
   {tab==='tools'?<>
   <div style={{margin:'0 0 18px'}}><p style={{fontSize:16,lineHeight:1.55,color:'var(--ink-2)',margin:'0 0 18px',maxWidth:'34em'}}>Practical tools from the Mulberry & Reed business library. Free PDFs. No email needed.</p>
    <div style={{display:'flex',flexWrap:'wrap',gap:8}}>{['All',...new Set(res.map(r=>r.category))].map(c=><FilterPill key={c} label={c} active={rcat===c} onClick={()=>setRcat(c)}/>)}</div></div>
   <div style={{display:'flex',flexDirection:'column',gap:18,paddingTop:8}}>{res.filter(r=>rcat==='All'||r.category===rcat).map(r=><ResourceCard key={r.number} {...r} href={'../../assets/'+r.file}/>)}</div>
   </>:<>
   <div style={{margin:'0 0 26px'}}><SearchField value={q} onChange={setQ}/></div>
   <div style={{display:'flex',gap:8,overflowX:'auto',padding:'2px 2px 4px',margin:'0 -2px 12px',scrollbarWidth:'none'}}>{CATS.map(c=><FilterPill key={c} label={c} active={cat===c} onClick={()=>setCat(c)}/>)}</div>
   <div style={{margin:'0 0 18px'}}><p style={{fontSize:13,fontWeight:600,color:'var(--ink-5)',margin:'0 0 8px'}}>What do you need help with?</p><div style={{display:'flex',flexWrap:'wrap',gap:8}}>{NEEDS.map(n=><FilterPill key={n} label={n} active={need===n} onClick={()=>setNeed(n)}/>)}</div></div>
   <p style={{fontSize:14,color:'var(--ink-5)',margin:'0 0 6px',borderTop:'1px solid rgba(35,27,25,.1)',paddingTop:22}}>{!all.length?'Loading guides…':vis.length===all.length?'All '+all.length+' guides':vis.length+' guide'+(vis.length===1?'':'s')}</p>
   <div>{vis.map(a=><ArticleRow key={a.slug} category={a.category} title={a.title} summary={a.summary} readingTime={a.readingTime} onClick={e=>{e.preventDefault();open(a.slug)}}/>)}</div>
   {all.length>0&&!vis.length&&<div style={{padding:'48px 0',textAlign:'center',color:'var(--ink-5)'}}><p style={{fontSize:18,margin:'0 0 12px'}}>No guides match that yet.</p><button onClick={()=>{setQ('');setCat('All');setNeed('All')}} style={{fontFamily:'inherit',fontSize:15,fontWeight:600,color:'var(--berry-deep)',background:'none',border:'none',cursor:'pointer'}}>Clear filters</button></div>}
   </>}
   <p style={{fontFamily:'var(--font-display)',fontWeight:500,fontSize:'clamp(18px,3vw,22px)',color:'var(--berry-deep)',margin:'64px 0 0',textAlign:'center'}}>Tell a good story. Make it stick. Leave a mark.</p>
  </div>}
  <SiteFooter/></div>
 </div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

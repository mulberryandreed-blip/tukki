<!-- @dsCard group="Website" viewport="480x900" name="Tukki 2 — playground" subtitle="Mobile-first Arabic Tukki: scroll story, tactile cards, 7 hidden berries" -->
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تُكِّي — ملعب رقمي للكبار</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600&display=swap">
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="tukki2.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tukki-content.js?v=10"></script>
<script type="text/babel" src="tukki2-bits.jsx"></script><script type="text/babel" src="tukki2-sections.jsx"></script>
</head><body><template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FAF7F2"/><circle cx="50" cy="50" r="18" fill="#8B1E3F"/></svg></template><div id="root"></div>
<script type="text/babel">
const TOOL=['منو زبونك بالضبط؟ (مو "الكل")','شنو المشكلة الي تحلها له؟','وين يشوفك الناس هسه؟','شنو الرقم الي تريده يتحرك؟','منو بالفريق مسؤول عنه؟'];
function Bar({count}){return <nav style={{position:'sticky',top:0,zIndex:40,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'10px 16px',background:'rgba(250,247,242,.9)',backdropFilter:'blur(8px)',borderBottom:'1px solid var(--border-hairline)'}}>
 <a href="#top" style={{fontFamily:'var(--disp)',fontWeight:900,fontSize:24,lineHeight:1.3,color:'var(--berry)',textDecoration:'none'}}>تُكِّي</a>
 <div style={{display:'flex',alignItems:'center',gap:10}}>
  {count>0&&<span title="توت لقيته" style={{display:'flex',alignItems:'center',gap:5,fontFamily:'var(--sans)',fontWeight:700,fontSize:13,animation:'t2-in .3s'}}><span className="t2-berry" style={{width:12,height:12}}></span><bdi dir="ltr">{count}/7</bdi></span>}
  <a href="index.html" lang="en" style={{fontFamily:"'Inter',sans-serif",fontSize:13,fontWeight:600,border:'1.5px solid var(--border-button)',borderRadius:999,padding:'6px 12px',color:'var(--ink)',textDecoration:'none'}}>English</a>
  <a className="t2-press" href="#contact" style={{minHeight:40,padding:'0 14px',fontSize:14,borderRadius:10,boxShadow:'0 3px 0 var(--ink)'}}>احجز</a>
 </div></nav>;}
function Toast({n}){return <div key={n} role="status" style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:60,background:'var(--ink)',color:'var(--paper)',borderRadius:999,padding:'8px 18px',fontFamily:'var(--sans)',fontWeight:700,fontSize:16,animation:'t2-in .25s ease-out'}}><bdi dir="ltr">{n}/7</bdi></div>;}
function Unlock({onClose}){const [c,setC]=React.useState([]);const n=c.length;
 return <div role="dialog" aria-modal="true" onClick={onClose} style={{position:'fixed',inset:0,zIndex:80,background:'rgba(35,27,25,.55)',display:'grid',placeItems:'center',padding:18}}>
  <div onClick={e=>e.stopPropagation()} className="t2-grid t2-paper" style={{width:'min(100%,440px)',maxHeight:'90vh',overflow:'auto',borderRadius:10,padding:'24px 22px',direction:'rtl',animation:'t2-in .35s ease-out',fontFamily:'var(--txt)'}}>
   <p className="t2-hand" style={{fontSize:30,margin:0}}>لقيتهن كلهن.</p>
   <p className="t2-p" style={{margin:'4px 0 18px'}}>واضح تدقق بالتفاصيل. إحنا هم. هاي أداة من أدوات تُكِّي ما نعرضها عادةً.</p>
   <p className="t2-kick">فحص سريع · قبل ما تصرف على التسويق</p>
   <div style={{display:'grid',gap:8}}>{TOOL.map((q,i)=>{const on=c.includes(i);return <label key={q} style={{display:'flex',gap:12,alignItems:'center',minHeight:44,padding:'4px 12px',background:on?'rgba(207,227,161,.45)':'rgba(255,253,248,.9)',border:'1px solid var(--border-default)',borderRadius:8,cursor:'pointer',fontSize:16}}>
    <input type="checkbox" checked={on} onChange={()=>setC(v=>on?v.filter(x=>x!==i):[...v,i])} style={{width:20,height:20,accentColor:'var(--leaf-green)'}}/>{q}</label>})}</div>
   <p className="t2-hand" style={{fontSize:18,margin:'16px 0'}}>{n===5?'(ممتاز. أنت جاهز للحملة.)':n>=3?'(قريب. خلينا نكمل الباقي سوا.)':'(عادي. لهذا السبب موجودين.)'}</p>
   <div style={{display:'flex',gap:10,flexWrap:'wrap'}}><a className="t2-press" href="#contact" onClick={onClose}>نكمل سوا</a><button className="t2-press ghost" onClick={onClose}>سد</button></div>
  </div></div>;}
function App(){const root=React.useRef();const [layer,add]=useStains(root);
 const [found,setFound]=React.useState(()=>{try{return JSON.parse(localStorage.getItem('tukki2-seeds')||'[]')}catch(e){return []}});
 const [toast,setToast]=React.useState(0);const [open,setOpen]=React.useState(false);
 const find=n=>setFound(f=>{if(f.includes(n))return f;const nf=[...f,n];localStorage.setItem('tukki2-seeds',JSON.stringify(nf));setToast(nf.length);setTimeout(()=>setToast(0),1400);if(nf.length===7)setTimeout(()=>setOpen(true),700);return nf});
 return <SeedCtx.Provider value={{found,find}}><div ref={root} className="t2">
  {layer}<Bar count={found.length}/>
  <Hero onStain={add}/><Story/><Stats/><How/><Why/><Pricing/><Quote/><Faq/><Contact/><Footer/>
  {toast>0&&<Toast n={toast}/>}{open&&<Unlock onClose={()=>setOpen(false)}/>}
 </div></SeedCtx.Provider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.p{height:120px;border-radius:16px;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}.p h4{font:500 28px/1 var(--font-display);margin:0}.p span{font:600 11px var(--font-sans);letter-spacing:.14em;text-transform:uppercase}</style></head><body><div class="g"><div class="p" style="background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--border-default)"><span style="color:var(--berry)">Paper</span><h4>Ink on paper</h4></div><div class="p" style="background:var(--espresso);color:var(--paper)"><span style="color:var(--rose)">Espresso</span><h4>Paper on espresso</h4></div><div class="p" style="background:var(--berry);color:var(--paper);border-radius:24px"><span>Berry</span><h4>Paper on berry</h4></div></div></body></html>

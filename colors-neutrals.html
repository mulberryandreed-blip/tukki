<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.g{display:flex;gap:14px;flex-wrap:wrap}.s{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;font-family:var(--font-sans)}.c{width:60px;height:60px;border-radius:50%;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(35,27,25,.08)}.s b{font-weight:500;font-size:11px;color:var(--ink);text-align:center;line-height:1.2}.s span{font-size:10px;color:var(--ink-3)}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--earth)"></div><b>Earth</b><span>#3A322A</span></div><div class="s"><div class="c" style="background:var(--stone)"></div><b>Stone</b><span>#A89B8C</span></div><div class="s"><div class="c" style="background:var(--sand)"></div><b>Sand</b><span>#E8DDC9</span></div><div class="s"><div class="c" style="background:var(--light)"></div><b>Light</b><span>#FAF8F2</span></div></div></body></html>

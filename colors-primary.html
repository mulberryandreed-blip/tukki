<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.g{display:flex;gap:14px;flex-wrap:wrap}.s{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;font-family:var(--font-sans)}.c{width:60px;height:60px;border-radius:50%;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(35,27,25,.08)}.s b{font-weight:500;font-size:11px;color:var(--ink);text-align:center;line-height:1.2}.s span{font-size:10px;color:var(--ink-3)}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--mulberry)"></div><b>Mulberry</b><span>#2E0F2D</span></div><div class="s"><div class="c" style="background:var(--ripe-berry)"></div><b>Ripe Berry</b><span>#8B1E3F</span></div><div class="s"><div class="c" style="background:var(--red-berry)"></div><b>Red Berry</b><span>#C8223F</span></div><div class="s"><div class="c" style="background:var(--pink-berry)"></div><b>Pink Berry</b><span>#E07A7A</span></div><div class="s"><div class="c" style="background:var(--white-mulberry)"></div><b>White Mulberry</b><span>#F4E9D7</span></div><div class="s"><div class="c" style="background:var(--leaf-green)"></div><b>Leaf Green</b><span>#3E7D32</span></div><div class="s"><div class="c" style="background:var(--fresh-leaf)"></div><b>Fresh Leaf</b><span>#8FBF5B</span></div><div class="s"><div class="c" style="background:var(--forest-green)"></div><b>Forest Green</b><span>#1F4D2B</span></div></div></body></html>
